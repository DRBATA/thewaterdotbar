services:
  - type: worker
    name: hedra-avatar-agent
    runtime: python
    plan: free
    region: oregon
    branch: feature/avatar-integration
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python agent_worker.py
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: HEDRA_API_KEY
        sync: false
      - key: HEDRA_AVATAR_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
